---
rust_gameserver_startup_args: "-load -nographics +server.secure 1 +server.tags {{ rust_gameserver_tags }}
  +wipeTimezone {{ rust_gameserver_timezone }} +wipetimer.wipeDayofWeek {{ rust_gameserver_wipe_day_of_week }}
  +wipetimer.wipeHourofDay {{ rust_gameserver_wipe_hour_of_day }}"
rust_gameserver_identity: "monthly"
rust_gameserver_maxplayers: 50
rust_gameserver_name: "Ansible Rust"
rust_gameserver_description: "A Rust Server Deployed from Ansible"
rust_gameserver_worldsize: 3500
rust_gameserver_tags: "Vanilla,NA,{{ rust_gameserver_wipe }}"
rust_gameserver_rcon_password: "test"
rust_gameserver_update_checking: 1
rust_gameserver_rcon_web_port: 8080
rust_gameserver_port: 28015
rust_gameserver_query_port: 28017
rust_gameserver_rcon_port: 28016
rust_gameserver_app_port: 28082
rust_gameserver_oxide_enabled: 1
rust_gameserver_oxide_update_on_boot: 1
rust_gameserver_heartbeat: 1
rust_gameserver_url: https://discord.gg/t77M3yAgKu
# Served from this repo rather than an image host: the previous default lived on
# imgbox, which went down and left every server that took the default with a broken
# banner. files/server-default.jpg is not copied anywhere by the role — it exists
# solely so this URL has something to resolve to.
#
# Deliberately pinned to `main` rather than a release tag: the banner is cosmetic
# and unversioned, and a moving ref means a future replacement (or a fix to a
# broken one) reaches every already-released version without a release. A tag
# would freeze that, and would have to be hand-updated on every version bump —
# with the forgotten case silently serving the old image forever.
rust_gameserver_banner_url: https://raw.githubusercontent.com/compscidr/ansible-rust-gameserver/main/roles/rust_gameserver/files/server-default.jpg
rust_gameserver_wipe_day_of_week: 4
rust_gameserver_wipe_hour_of_day: 19
rust_gameserver_wipe_minute_of_hour: 0
rust_gameserver_wipe: "weekly" # can be monthly,biweekly,or weekly
rust_gameserver_wipe_bp: 1 # whether or not to wipe blueprint (defaults to true)
rust_gameserver_timezone: "America/Los_Angeles"
rust_gameserver_seed: 50000
# Disable the image-defined HEALTHCHECK on the container.
#
# The upstream rust-server image ships a healthcheck that runs `rcon test` on a
# 30s interval and treats `RconApp::Error` as unhealthy. Docker itself respects
# the image's `start_period` (15min) and won't mark the container unhealthy
# while the steam install is still running — but some third-party Docker
# managers (notably UGREEN NAS's `docker_serv`, observed killing containers
# via SIGKILL ~17s after a failed health probe regardless of `start_period`)
# don't. On those systems the container gets killed mid-install on every
# cycle and the server never finishes booting.
#
# Set this to `true` to override the image's healthcheck with `["NONE"]`,
# which Docker treats as "no healthcheck". You'll lose the unhealthy-marker
# signal in `docker ps`, but the container will be allowed to finish booting.
rust_gameserver_healthcheck_disabled: false
# When true (default), the wipe cron + wipe.sh are installed. Set false when an
# external manager (e.g. rustd.xyz) owns wipes: the cron is REMOVED and wipe.sh
# is not templated.
rust_gameserver_manage_wipe_cron: true
# When true (default), rust.env is re-templated on every run (Ansible is
# authoritative). Set false to write it only when absent (bootstrap-only), so a
# runtime manager can own name/description/etc. without deploys reverting them.
rust_gameserver_overwrite_env: true
# Runtime uid/gid the container drops to (PUID/PGID) — also owns the per-identity
# config directories so Oxide/the server can create files there, and groups rust.env.
# The identity the game runs as. Give it a NAME and the role ensures the account and group
# exist and derives the uid/gid from them; leave it empty and the numeric puid/pgid below are
# used as-is (the pre-0.5.0 behaviour, kept so existing installs are not re-homed).
#
# Naming it is strongly recommended. A bare uid means "whoever happens to be uid 1000 on this
# host", which is how one deployment ended up running the game as the very account an external
# manager connects with -- at which point the group-write permissions and the setgid directory
# below grant nothing, because the manager already owns every file. See the collision assert
# in tasks/main.yml.
#
# Adoption never modifies an existing account. If the named user already exists it is looked
# up and its REAL uid and primary gid are used -- rust_gameserver_runtime_group is not applied
# to it, because rewriting the primary group of an account like `steam`, which other things on
# the host may already depend on, is not a change a deploy should make silently. If its primary
# group is not the one requested here, the role refuses rather than quietly using a different
# group from the one asked for.
#
# rust_gameserver_runtime_group therefore only takes effect when the role CREATES the account.
# How the game is run: 'docker' (the image owns steamcmd and the restart policy) or
# 'baremetal' (steamcmd installs the game, a per-identity systemd unit supervises it).
#
# Everything else in this role is shared between them -- the same directory layout, the
# same rust.env/seed.env, the same permissions. An external manager sees an identical
# filesystem either way.
#
# Several BARE-METAL instances can share a host: run the role once per identity and each
# gets its own install tree, its own rust-<identity>.service and its own ports. Give each
# one a different rust_gameserver_identity and non-colliding ports. Note each install tree
# is a full copy of the game (20-30 GB) -- deliberate, since two servers must never share
# an install dir.
rust_gameserver_deployment: docker

# Bare metal only. steamcmd is shared by every instance on the host; installing it is
# idempotent, so running the role for a second identity does not re-fetch it.
rust_gameserver_steamcmd_dir: /opt/steamcmd
# Left empty so the role derives it from the runtime account's REAL home directory. Guessing
# /home/<name> puts steamclient.so somewhere Steamworks never looks, and the symptom is a
# server that starts and then quietly fails to reach Steam. Set it only to override.
rust_gameserver_steam_sdk_dir: ""
rust_gameserver_service_enabled: true
# See the note in the unit template: an RCON restart exits the process, so without a
# restart policy nothing brings the server back.
rust_gameserver_service_restart: always
rust_gameserver_service_restart_sec: 10

rust_gameserver_runtime_user: ""
rust_gameserver_runtime_group: "{{ rust_gameserver_runtime_user }}"

# Used directly only when rust_gameserver_runtime_user is empty; otherwise the role overwrites
# these with the real ids of that account.
rust_gameserver_puid: "1000"
rust_gameserver_pgid: "1000"

# Host users that an external manager (e.g. rustd.xyz) connects as. Each is appended
# to the runtime group so it can write inside the identity directory. Deliberately
# NOT a sudo grant: everything such a manager does is confined to that one directory
# tree, and it drives the server lifecycle over RCON, so root is never required.
# Requires rust_gameserver_identity_dir_mode to allow group write.
rust_gameserver_manager_users: []

# Mode for /etc/rust/server/<identity>. Default matches the previous behaviour.
# Set '2775' when rust_gameserver_manager_users is non-empty: group write lets the
# manager create snapshots and delete map files, and SETGID keeps the runtime group
# on files it replaces — without it, `sed -i` on seed.env hands the file to the
# manager's own group and the container can no longer read its own seed.
rust_gameserver_identity_dir_mode: '0755'

# Where a server's ENTIRE tree lives on the host: the game install root, mounted at
# /steamcmd/rust in the container. The game's own layout nests the identity (save) dir
# at server/<identity> inside it, so everything about one server — binaries, plugins,
# saves, env files — sits under this one directory. Per-server on purpose: install
# directories cannot be shared between containers (concurrent steamcmd updates and
# runtime state conflict).
rust_gameserver_install_dir: "/etc/rust/install/{{ rust_gameserver_identity }}"
# The identity (save) dir inside the install root — where wipes delete files, seed.env
# and rust.env live, and an external manager (rustd.xyz) works.
rust_gameserver_data_dir: "{{ rust_gameserver_install_dir }}/server/{{ rust_gameserver_identity }}"
