---
# --- Runtime identity ---------------------------------------------------------------
# Everything below this point -- file ownership, the setgid identity directory, the group
# an external manager is added to, the container's PUID/PGID -- hangs off one question:
# WHICH account does the game run as. Resolve it first so the answer is explicit rather
# than whatever uid 1000 happens to mean on this host.
#
# Named mode ensures the account exists and adopts its real ids. Existing accounts are
# looked up, never modified: no shell, home or group is imposed on an account this role
# did not create, because adopting `steam` on a host that already uses it must not
# silently change how someone logs in.
- name: Look up the runtime account
  tags: rust_gameserver
  become: true
  ansible.builtin.getent:
    database: passwd
    key: "{{ rust_gameserver_runtime_user }}"
    fail_key: false
  when: rust_gameserver_runtime_user | length > 0

- name: Note whether the runtime account already exists
  tags: rust_gameserver
  ansible.builtin.set_fact:
    rust_gameserver_runtime_exists: >-
      {{ ansible_facts.getent_passwd[rust_gameserver_runtime_user] is not none }}
  when: rust_gameserver_runtime_user | length > 0

# CREATE path only. An existing account is never passed to the user module: `group:` would
# rewrite its primary group, which for an account like `steam` that other things already
# depend on is exactly the kind of change a deploy has no business making silently.
- name: Ensure the runtime group exists
  tags: rust_gameserver
  become: true
  ansible.builtin.group:
    name: "{{ rust_gameserver_runtime_group }}"
    system: true
    state: present
  register: rust_gameserver_group_result
  when:
    - rust_gameserver_runtime_user | length > 0
    - not rust_gameserver_runtime_exists | bool

- name: Create the runtime user
  tags: rust_gameserver
  become: true
  ansible.builtin.user:
    name: "{{ rust_gameserver_runtime_user }}"
    group: "{{ rust_gameserver_runtime_group }}"
    system: true
    create_home: false
    state: present
  register: rust_gameserver_user_result
  when:
    - rust_gameserver_runtime_user | length > 0
    - not rust_gameserver_runtime_exists | bool

# ADOPT path: take the account exactly as it is. Its real primary gid is used rather than
# rust_gameserver_runtime_group, so nothing about the account changes.
- name: Resolve the existing account's primary group
  tags: rust_gameserver
  become: true
  ansible.builtin.getent:
    database: group
    key: "{{ ansible_facts.getent_passwd[rust_gameserver_runtime_user][2] }}"
  when:
    - rust_gameserver_runtime_user | length > 0
    - rust_gameserver_runtime_exists | bool

# Refused rather than silently ignored: carrying on would use a different group from the one
# the operator asked for, and the group is what every permission in this role hangs off.
- name: Refuse to adopt an account whose primary group is not the requested one
  tags: rust_gameserver
  ansible.builtin.assert:
    that:
      - (ansible_facts.getent_group | first) == rust_gameserver_runtime_group
    fail_msg: >-
      '{{ rust_gameserver_runtime_user }}' already exists with primary group
      '{{ ansible_facts.getent_group | first }}', but rust_gameserver_runtime_group is
      '{{ rust_gameserver_runtime_group }}'. Adopting an account never modifies it, so this
      role will not change its primary group. Either set rust_gameserver_runtime_group to
      '{{ ansible_facts.getent_group | first }}', or pick a runtime user that does not exist
      yet and let the role create it.
  when:
    - rust_gameserver_runtime_user | length > 0
    - rust_gameserver_runtime_exists | bool

- name: Use the runtime identity's real uid and gid
  tags: rust_gameserver
  ansible.builtin.set_fact:
    rust_gameserver_puid: >-
      {{ ansible_facts.getent_passwd[rust_gameserver_runtime_user][1]
         if rust_gameserver_runtime_exists | bool
         else rust_gameserver_user_result.uid }}
    rust_gameserver_pgid: >-
      {{ ansible_facts.getent_passwd[rust_gameserver_runtime_user][2]
         if rust_gameserver_runtime_exists | bool
         else rust_gameserver_group_result.gid }}
  when: rust_gameserver_runtime_user | length > 0

# Numeric mode: we still need the NAME to check it against the manager users below.
# fail_key: false because the uid need not exist on the HOST at all -- in a container-only
# deployment it only has to exist inside the image. An unresolvable uid is not an error here;
# it just means there is no name to compare against the manager users, and no account to
# become for a bare-metal launch. Both of those are handled where they matter.
- name: Resolve the runtime user's name from its uid
  tags: rust_gameserver
  become: true
  ansible.builtin.getent:
    database: passwd
    key: "{{ rust_gameserver_puid }}"
    fail_key: false
  when: rust_gameserver_runtime_user | length == 0

- name: Record which account the game will run as
  tags: rust_gameserver
  ansible.builtin.set_fact:
    rust_gameserver_runtime_user_name: >-
      {{ rust_gameserver_runtime_user
         if rust_gameserver_runtime_user | length > 0
         else (ansible_facts.getent_passwd | dict2items
               | selectattr('value', 'ne', None) | map(attribute='key') | first | default('')) }}

# The check that would have caught it. When the game runs as one of the manager users,
# every permission decision in this role becomes a no-op: the manager owns the files
# outright, so group write grants nothing, the setgid directory grants nothing, and
# adding the manager to "the runtime group" adds it to its own group. The deployment
# appears to work and its security properties are entirely absent -- and on top of that
# the manager can read the RCON password out of the game's /proc entry, which is the one
# thing running it as a separate account would have prevented.
#
# Refused rather than warned: a warning in a play that goes on to succeed is a warning
# nobody reads.
- name: Refuse to run the game as one of the manager users
  tags: rust_gameserver
  ansible.builtin.assert:
    that:
      - rust_gameserver_runtime_user_name not in rust_gameserver_manager_users
    fail_msg: >-
      The game would run as '{{ rust_gameserver_runtime_user_name }}', which is also in
      rust_gameserver_manager_users. An external manager must be a DIFFERENT account from the
      one the game runs as, or the group-write permissions and the setgid identity directory
      grant nothing and the manager can read the RCON password from the game's process
      arguments. Set rust_gameserver_runtime_user to a dedicated account (the role will create
      it) and chown the install tree to it.
  when:
    - rust_gameserver_manager_users | length > 0
    - rust_gameserver_runtime_user_name | length > 0

- name: Create base config directories
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
    owner: root
    group: root
  loop:
    - /etc/rust
    - /etc/rust/install

# The identity directory itself is where an external manager (rustd.xyz) does its
# work: it creates snapshot subdirectories, rewrites seed.env and deletes map/save
# files here. Managing it explicitly — rather than letting it appear as a side effect
# of creating its children — is what makes `rust_gameserver_identity_dir_mode` mean
# anything.
#
# SETGID (the leading 2 in 2775) keeps the runtime group on anything created here, so a
# file a manager user creates stays readable by the container (which runs as PGID).
#
# The directory mode alone is NOT sufficient for rust.env and seed.env, and this is the
# subtle part. Both are bind-mounted into the container as SINGLE FILES, and a single-file
# bind mount follows the INODE, not the path. A manager that rewrites them the easy way
# (`sed -i`, or any write-temp-then-rename) only needs directory write — but it replaces
# the inode, orphaning the mount, and the container then reads the original file forever.
# That silently cost rustd.xyz every seed change it ever made: wipes kept regenerating the
# same map because the new seed landed in a file nothing was reading.
#
# So the manager must write these two files IN PLACE (truncate and rewrite the same inode),
# and that needs write permission on the FILE, not just the directory. Hence the explicit
# group-write modes below rather than relying on the directory grant.
# An external wipe manager (rustd.xyz) needs to create, rewrite and delete files in
# the identity directory. It deliberately does NOT get root: everything it does is
# confined to that one tree, and the server lifecycle it drives goes over RCON rather
# than docker or systemd — so group membership is sufficient and a sudo grant would be
# strictly more privilege than the job needs.
#
# Resolved from the numeric PGID rather than taking a group name as input, so this
# cannot drift from the group the container actually runs as.
- name: Resolve the runtime group name for manager users
  tags: rust_gameserver
  become: true
  ansible.builtin.getent:
    database: group
    key: "{{ rust_gameserver_pgid }}"
  when: rust_gameserver_manager_users | length > 0

- name: Add manager users to the runtime group
  tags: rust_gameserver
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ ansible_facts.getent_group | first }}"
    append: true
  loop: "{{ rust_gameserver_manager_users }}"
  when: rust_gameserver_manager_users | length > 0

# The install root and its server/ parent come first so their ownership is deliberate:
# the container's runtime user must be able to CREATE game files here (steamcmd writes
# the whole install), and letting them appear as implicit parents of the identity dir
# would leave them root-owned.
- name: Create the install root (owned by the runtime user)
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
    owner: "{{ rust_gameserver_puid }}"
    group: "{{ rust_gameserver_pgid }}"
  loop:
    - "{{ rust_gameserver_install_dir }}"
    - "{{ rust_gameserver_install_dir }}/server"

- name: Create the server identity directory
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ rust_gameserver_data_dir }}"
    state: directory
    mode: "{{ rust_gameserver_identity_dir_mode }}"
    owner: "{{ rust_gameserver_puid }}"
    group: "{{ rust_gameserver_pgid }}"

# Everything else inside the install tree is created by the game/Oxide at runtime —
# these two exist ONLY so plugins can be copied in (the README's documented pattern)
# on a fresh host BEFORE the first boot has extracted Oxide; ansible's copy module
# does not create parent directories.
- name: Create plugin copy-in directories (owned by the runtime user)
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
    owner: "{{ rust_gameserver_puid }}"
    group: "{{ rust_gameserver_pgid }}"
  loop:
    - "{{ rust_gameserver_install_dir }}/oxide/plugins"
    - "{{ rust_gameserver_install_dir }}/RustDedicated_Data/Managed"

# rust.env carries RUST_RCON_PASSWORD — not world-readable. The runtime group can
# read it (the container entrypoint and dropped game user), other host users cannot.
- name: Copy rust.env to host
  tags: rust_gameserver
  become: true
  ansible.builtin.template:
    src: rust.env.j2
    dest: "{{ rust_gameserver_data_dir }}/rust.env"
    # 660, not 640: the manager user must rewrite this in place (see the inode note above).
    # Group-write is not an escalation — the identity dir is already group-writable, so a
    # manager could already replace this file; it stays non-world-readable for RUST_RCON_PASSWORD.
    mode: '660'
    owner: root
    group: "{{ rust_gameserver_pgid }}"
    force: "{{ rust_gameserver_overwrite_env }}"

# `force: false` above skips EVERYTHING when the file exists — including mode/owner.
# This separate attributes-only task retrofits the not-world-readable fix onto
# existing installs without ever touching the file's content.
- name: Enforce rust.env permissions
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ rust_gameserver_data_dir }}/rust.env"
    mode: '660'
    owner: root
    group: "{{ rust_gameserver_pgid }}"

# seed.env is deliberately create-only for EVERYONE: wipe.sh rotates the seed at
# runtime, so re-templating it on deploy would silently change the map on the
# next server restart (accidental wipe).
- name: Create seed.env on host (never overwritten)
  tags: rust_gameserver
  become: true
  ansible.builtin.template:
    src: seed.env.j2
    dest: "{{ rust_gameserver_data_dir }}/seed.env"
    # 664 + runtime group for the same in-place-rewrite reason as rust.env. Not secret, so
    # it keeps the world-read bit it has always had.
    mode: '664'
    owner: root
    group: "{{ rust_gameserver_pgid }}"
    force: false

# Same retrofit as rust.env, and for the same reason: `force: false` above skips mode and
# group on an existing file, so without this every install created before this change keeps
# 644 root:root and the manager still cannot rewrite the seed in place.
- name: Enforce seed.env permissions
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ rust_gameserver_data_dir }}/seed.env"
    mode: '664'
    owner: root
    group: "{{ rust_gameserver_pgid }}"

- name: Copy wipe.sh to host
  tags: rust_gameserver
  become: true
  ansible.builtin.template:
    src: wipe.sh.j2
    dest: "{{ rust_gameserver_data_dir }}/wipe.sh"
    mode: '644'
    owner: root
    group: root
  when: rust_gameserver_manage_wipe_cron

# this should fire every week on the day of the week specified at the time
# and then the wipe script will determine whether or not to actually wipe
# depending on the rust_gameserver_wipe and the current day
- name: Cron wipe
  tags: rust_gameserver
  become: true
  ansible.builtin.cron:
    name: "rust_wipe_{{ rust_gameserver_identity }}"
    job: "bash {{ rust_gameserver_data_dir }}/wipe.sh"
    cron_file: "rust_wipe_{{ rust_gameserver_identity }}"
    minute: "{{ rust_gameserver_wipe_minute_of_hour }}"
    hour: "{{ rust_gameserver_wipe_hour_of_day }}"
    weekday: "{{ rust_gameserver_wipe_day_of_week }}"
    user: root
    state: "{{ 'present' if rust_gameserver_manage_wipe_cron else 'absent' }}"

# One role, two ways to run the game. Everything above is shared: the same directory
# layout, the same rust.env/seed.env, the same permissions and manager-group model. Only
# the launch mechanism differs -- a container with a restart policy, or a systemd unit.
#
# Kept as an include rather than two roles because the shared part is most of the role,
# and the panel (rustd.xyz) must see an identical filesystem either way: it reads and
# rewrites rust.env and seed.env in place regardless of how the process is started.
- name: Reject an unknown deployment type
  tags: rust_gameserver
  ansible.builtin.assert:
    that:
      - rust_gameserver_deployment in ['docker', 'baremetal']
    fail_msg: >-
      rust_gameserver_deployment is '{{ rust_gameserver_deployment }}';
      it must be 'docker' or 'baremetal'.

- name: Deploy the server
  tags: rust_gameserver
  ansible.builtin.include_tasks: "{{ rust_gameserver_deployment }}.yml"
