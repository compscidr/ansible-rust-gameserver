---
- name: Create base config directories
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
    owner: root
    group: root
  loop:
    - /etc/rust
    - /etc/rust/server

# Per-identity directories are owned by the container's runtime user (PUID/PGID):
# Oxide and the game server run as that uid and need to CREATE files here (plugin
# data, compiled artifacts, config rewrites) — root-owned 755 dirs break that.
- name: Create server identity directories (owned by the runtime user)
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '755'
    owner: "{{ rust_gameserver_puid }}"
    group: "{{ rust_gameserver_pgid }}"
  loop:
    - /etc/rust/server/{{ rust_gameserver_identity }}/oxide
    - /etc/rust/server/{{ rust_gameserver_identity }}/oxide/plugins
    - /etc/rust/server/{{ rust_gameserver_identity }}/cfg
    - /etc/rust/server/{{ rust_gameserver_identity }}/RustDedicated_Data
    - /etc/rust/server/{{ rust_gameserver_identity }}/RustDedicated_Data/Managed

# rust.env carries RUST_RCON_PASSWORD — not world-readable. The runtime group can
# read it (the container entrypoint and dropped game user), other host users cannot.
- name: Copy rust.env to host
  tags: rust_gameserver
  become: true
  ansible.builtin.template:
    src: rust.env.j2
    dest: /etc/rust/server/{{ rust_gameserver_identity }}/rust.env
    mode: '640'
    owner: root
    group: "{{ rust_gameserver_pgid }}"
    force: "{{ rust_gameserver_overwrite_env }}"

# `force: false` above skips EVERYTHING when the file exists — including mode/owner.
# This separate attributes-only task retrofits the not-world-readable fix onto
# existing installs without ever touching the file's content.
- name: Enforce rust.env permissions
  tags: rust_gameserver
  become: true
  ansible.builtin.file:
    path: /etc/rust/server/{{ rust_gameserver_identity }}/rust.env
    mode: '640'
    owner: root
    group: "{{ rust_gameserver_pgid }}"

# seed.env is deliberately create-only for EVERYONE: wipe.sh rotates the seed at
# runtime, so re-templating it on deploy would silently change the map on the
# next server restart (accidental wipe).
- name: Create seed.env on host (never overwritten)
  tags: rust_gameserver
  become: true
  ansible.builtin.template:
    src: seed.env.j2
    dest: /etc/rust/server/{{ rust_gameserver_identity }}/seed.env
    mode: '644'
    owner: root
    group: root
    force: false

- name: Copy wipe.sh to host
  tags: rust_gameserver
  become: true
  ansible.builtin.template:
    src: wipe.sh.j2
    dest: /etc/rust/server/{{ rust_gameserver_identity }}/wipe.sh
    mode: '644'
    owner: root
    group: root
  when: rust_gameserver_manage_wipe_cron

# this should fire every week on the day of the week specified at the time
# and then the wipe script will determine whether or not to actually wipe
# depending on the rust_gameserver_wipe and the current day
- name: Cron wipe
  tags: rust_gameserver
  become: true
  ansible.builtin.cron:
    name: "rust_wipe_{{ rust_gameserver_identity }}"
    job: "bash /etc/rust/server/{{ rust_gameserver_identity }}/wipe.sh"
    cron_file: "rust_wipe_{{ rust_gameserver_identity }}"
    minute: "{{ rust_gameserver_wipe_minute_of_hour }}"
    hour: "{{ rust_gameserver_wipe_hour_of_day }}"
    weekday: "{{ rust_gameserver_wipe_day_of_week }}"
    user: root
    state: "{{ 'present' if rust_gameserver_manage_wipe_cron else 'absent' }}"

- name: Deploy rust server
  become: true
  community.docker.docker_container:
    name: "rust-{{ rust_gameserver_identity }}"
    image: ghcr.io/compscidr/rust-server
    pull: true
    volumes:
      - "/etc/rust/server/{{ rust_gameserver_identity }}:/steamcmd/rust/server/{{ rust_gameserver_identity }}:rw" # persist save files
      - "/etc/rust/server/{{ rust_gameserver_identity }}/rust.env:/etc/rust/rust.env" # lets us change the env without redeploying container
      - "/etc/rust/server/{{ rust_gameserver_identity }}/seed.env:/etc/rust/seed.env" # lets us change the seed without redploying container
      - "/etc/rust/server/{{ rust_gameserver_identity }}/oxide:/steamcmd/rust/oxide"  # plugins / plugin config
      - "/etc/rust/server/{{ rust_gameserver_identity }}/RustDedicated_Data:/steamcmd/rust/RustDedicated_Data" # dll plugins
    ports:
      - "{{ rust_gameserver_port }}:{{ rust_gameserver_port }}"
      - "{{ rust_gameserver_port }}:{{ rust_gameserver_port }}/udp"
      - "{{ rust_gameserver_rcon_port }}:{{ rust_gameserver_rcon_port }}"
      - "{{ rust_gameserver_rcon_port }}:{{ rust_gameserver_rcon_port }}/udp"
      - "{{ rust_gameserver_query_port }}:{{ rust_gameserver_query_port }}"
      - "{{ rust_gameserver_query_port }}:{{ rust_gameserver_query_port }}/udp"
      - "{{ rust_gameserver_rcon_web_port }}:8080"
      - "{{ rust_gameserver_app_port }}:{{ rust_gameserver_app_port }}"
      - "{{ rust_gameserver_app_port }}:{{ rust_gameserver_app_port }}/udp"
    env:
      TZ: "{{ rust_gameserver_timezone }}"
      PUID: "{{ rust_gameserver_puid }}"
      PGID: "{{ rust_gameserver_pgid }}"
    devices:
      - /dev/dri:/dev/dri
    restart_policy: unless-stopped
    memory: 20g
    # The image ships a HEALTHCHECK that runs `rcon test` and reports unhealthy
    # while RCON is starting up. Docker respects `start_period`, but some
    # third-party container managers (e.g. UGREEN NAS's docker_serv) don't and
    # will kill the container mid-install. When this is set, override the
    # image's healthcheck with `["NONE"]` so it's effectively disabled.
    healthcheck: "{{ {'test': ['NONE']} if rust_gameserver_healthcheck_disabled else omit }}"
  when: not (rust_gameserver_molecule_test | default(false))
