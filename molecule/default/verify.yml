---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Rotate the seed like wipe.sh does
      ansible.builtin.copy:
        content: 'RUST_SERVER_SEED="99999"'
        dest: /etc/rust/install/test/server/test/seed.env
        mode: '644'

    - name: Drift rust.env like an external manager would
      ansible.builtin.lineinfile:
        path: /etc/rust/install/test/server/test/rust.env
        regexp: '^RUST_SERVER_NAME='
        line: 'RUST_SERVER_NAME="Renamed At Runtime"'

    # Adoption must not touch the account. Give it a distinctive shell first: converge CREATED
    # rustsvc, so the re-include below takes the adopt path, and anything the role does to an
    # existing user shows up here. The old implementation passed existing accounts to the user
    # module, which would rewrite their primary group.
    - name: Give the runtime account a distinctive shell before it is adopted
      ansible.builtin.user:
        name: rustsvc
        shell: /bin/bash

    - name: Re-include rust_gameserver role
      ansible.builtin.include_role:
        name: rust_gameserver
      vars:
        rust_gameserver_identity: "test"
        rust_gameserver_name: "Test Server"
        rust_gameserver_description: "Molecule Test Server"
        rust_gameserver_rcon_password: "testpass"
        # Must match converge exactly. Re-running the role WITHOUT these resets the
        # identity directory to the default 0755 and revokes the manager's group write —
        # which is precisely what this re-include caught, and is a real hazard: an
        # operator who deploys from a context missing these vars silently locks the
        # external manager out of the directory it needs.
        # A dedicated runtime account, distinct from the manager. Without this the game
        # would run as molecule_manager (the first regular user in the container, so uid
        # 1000) and the role now refuses -- correctly, since every permission it sets
        # would be a no-op.
        rust_gameserver_runtime_user: "rustsvc"
        rust_gameserver_manager_users:
          - "molecule_manager"
        rust_gameserver_identity_dir_mode: '2775'
        rust_gameserver_wipe_day_of_week: 4
        rust_gameserver_wipe_hour_of_day: 19
        rust_gameserver_molecule_test: true

    - name: Verify rust config directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_dirs
      loop:
        - /etc/rust
        - /etc/rust/install
        - /etc/rust/install/test
        - /etc/rust/install/test/server/test
        - /etc/rust/install/test/oxide
        - /etc/rust/install/test/oxide/plugins
        - /etc/rust/install/test/RustDedicated_Data
        - /etc/rust/install/test/RustDedicated_Data/Managed

    - name: Assert all directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
      loop: "{{ config_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify rust configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_files
      loop:
        - /etc/rust/install/test/server/test/rust.env
        - /etc/rust/install/test/server/test/seed.env
        - /etc/rust/install/test/server/test/wipe.sh

    - name: Assert configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
      loop: "{{ config_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The regression test for the single-file bind mount. rustd.xyz rewrites these two files
    # IN PLACE so the container's mount (which follows the inode, not the path) keeps pointing
    # at the live data — and an in-place rewrite needs write permission on the FILE.
    #
    # Without group write (rust.env was 640 root:<pgid>, seed.env 644 root:root) the manager can
    # only replace the file, which orphans the mount and silently strands the container on the
    # original inode.
    #
    # Asserted on the mode bits rather than "the manager can write", because the manager user
    # does not exist in this scenario; the group grant is what makes it possible.
    # The runtime identity must be a real, separate account -- this is what makes the
    # group-write permissions below mean anything. If the game ran as the manager, it
    # would own every file outright and none of the permission work would be doing
    # anything, which is precisely the state the role now refuses to deploy.
    - name: Read the runtime account after adoption
      ansible.builtin.getent:
        database: passwd
        key: rustsvc

    - name: Assert adopting the account did not modify it
      ansible.builtin.assert:
        that:
          - (ansible_facts.getent_passwd | dict2items | first).value[5] == '/bin/bash'
          - (ansible_facts.getent_passwd | dict2items | first).value[2] == rust_gameserver_pgid | string
        fail_msg: >-
          rustsvc was altered by being adopted -- shell
          {{ (ansible_facts.getent_passwd | dict2items | first).value[5] }}, primary gid
          {{ (ansible_facts.getent_passwd | dict2items | first).value[2] }}. An existing
          account must be looked up, never rewritten.

    - name: Look up the runtime and manager accounts
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      register: runtime_accounts
      loop:
        - rustsvc
        - molecule_manager

    - name: Assert the game runs as its own account, not the manager's
      ansible.builtin.assert:
        that:
          - (runtime_accounts.results[0].ansible_facts.getent_passwd | dict2items | first).value[1]
            != (runtime_accounts.results[1].ansible_facts.getent_passwd | dict2items | first).value[1]
        fail_msg: >-
          rustsvc and molecule_manager resolved to the same uid, so every permission
          this role sets would be a no-op.

    - name: Stat the env files the external manager must rewrite in place
      ansible.builtin.stat:
        path: "{{ item }}"
      register: manager_writable_files
      loop:
        - /etc/rust/install/test/server/test/rust.env
        - /etc/rust/install/test/server/test/seed.env

    - name: Assert the env files are group-writable for the runtime group
      ansible.builtin.assert:
        that:
          - item.stat.wgrp
          # Against the runtime gid the role actually resolved, not a literal. The previous
          # hardcoded 1000 only held while the runtime identity happened to be uid 1000 --
          # which is the very assumption this change exists to remove.
          - item.stat.gid | int == rust_gameserver_pgid | int
        fail_msg: >-
          {{ item.stat.path }} is mode {{ item.stat.mode }} gid {{ item.stat.gid }}
          (expected gid {{ rust_gameserver_pgid }}) —
          the manager cannot rewrite it in place, so it would replace the inode and
          orphan the container's single-file bind mount.
      loop: "{{ manager_writable_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert rust.env is still not world-readable
      ansible.builtin.assert:
        that:
          - not manager_writable_files.results[0].stat.roth
        fail_msg: rust.env carries RUST_RCON_PASSWORD and must never be world-readable

    # Asserted by SOURCING rather than by matching bytes. rust.env values are shell-quoted with
    # `| quote` (shlex.quote), which quotes only when the value needs it -- so a literal-text
    # assertion pins an incidental format and breaks the moment a value does or does not need
    # quoting. What matters is the value the entrypoint ends up with.
    - name: Source rust.env the way the entrypoint does
      ansible.builtin.shell:
        cmd: >-
          set -a; . /etc/rust/install/test/server/test/rust.env; set +a;
          printf '%s' "$RUST_SERVER_NAME"
      register: sourced_name
      changed_when: false

    - name: Assert rust.env carries the configured server name
      ansible.builtin.assert:
        that:
          - sourced_name.stdout == 'Test Server'
        fail_msg: >-
          rust.env sourced to '{{ sourced_name.stdout }}', expected the templated value. This
          scenario leaves rust_gameserver_overwrite_env at its default of true, so the role is
          authoritative and the drift applied above must be re-templated away. The
          manager-owned case (overwrite_env false) is covered by the external scenario.

    - name: Check if rust wipe cron exists
      ansible.builtin.stat:
        path: /etc/cron.d/rust_wipe_test
      register: cron_file_check

    - name: Assert cron job file exists
      ansible.builtin.assert:
        that:
          - cron_file_check.stat.exists
          - cron_file_check.stat.isreg

    - name: Read seed.env after re-converge
      ansible.builtin.slurp:
        src: /etc/rust/install/test/server/test/seed.env
      register: seed_env_content

    - name: Assert the rotated seed survived the re-run (create-only semantics)
      ansible.builtin.assert:
        that:
          - "'99999' in (seed_env_content.content | b64decode)"

    # "the drift was re-templated away" is already asserted above, by sourcing rust.env and
    # comparing the VALUE. This used to assert the same thing a second time by matching the
    # literal bytes `RUST_SERVER_NAME="Test Server"`, which pinned an incidental quoting format
    # rather than the property.

    - name: Stat oxide plugins directory ownership
      ansible.builtin.stat:
        path: /etc/rust/install/test/oxide/plugins
      register: oxide_dir_stat

    - name: Assert identity directories are owned by the runtime user
      ansible.builtin.assert:
        that:
          - oxide_dir_stat.stat.uid == rust_gameserver_puid | int
          - oxide_dir_stat.stat.gid == rust_gameserver_pgid | int

    - name: Stat rust.env permissions
      ansible.builtin.stat:
        path: /etc/rust/install/test/server/test/rust.env
      register: rust_env_stat

    - name: Assert rust.env is 660 root:pgid (enforced even on the bootstrap path)
      ansible.builtin.assert:
        that:
          - rust_env_stat.stat.mode == '0660'
          - rust_env_stat.stat.uid == 0
          - rust_env_stat.stat.gid == rust_gameserver_pgid | int

    - name: Stat the identity directory
      ansible.builtin.stat:
        path: /etc/rust/install/test/server/test
      register: identity_dir_stat

    - name: Assert the identity directory is group-writable and setgid
      ansible.builtin.assert:
        that:
          - identity_dir_stat.stat.mode == '2775'
          - identity_dir_stat.stat.gid == rust_gameserver_pgid | int
        fail_msg: >-
          The identity directory must be group-writable and SETGID. Without setgid,
          `sed -i` on seed.env hands the replacement to the manager's own group and
          the container can no longer read its own seed.

    - name: Read the runtime group
      ansible.builtin.getent:
        database: group
        key: "{{ rust_gameserver_pgid }}"

    - name: Assert the manager user was added to the runtime group
      ansible.builtin.assert:
        that:
          - "'molecule_manager' in (ansible_facts.getent_group | dict2items | first).value[2]"
        fail_msg: >-
          molecule_manager is not in the runtime group, so an external manager could
          not write inside the identity directory without root.
