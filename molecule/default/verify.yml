---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Rotate the seed like wipe.sh does
      ansible.builtin.copy:
        content: 'RUST_SERVER_SEED="99999"'
        dest: /etc/rust/install/test/server/test/seed.env
        mode: '644'

    - name: Drift rust.env like an external manager would
      ansible.builtin.lineinfile:
        path: /etc/rust/install/test/server/test/rust.env
        regexp: '^RUST_SERVER_NAME='
        line: 'RUST_SERVER_NAME="Renamed At Runtime"'

    - name: Re-include rust_gameserver role
      ansible.builtin.include_role:
        name: rust_gameserver
      vars:
        rust_gameserver_identity: "test"
        rust_gameserver_name: "Test Server"
        rust_gameserver_description: "Molecule Test Server"
        rust_gameserver_rcon_password: "testpass"
        # Must match converge exactly. Re-running the role WITHOUT these resets the
        # identity directory to the default 0755 and revokes the manager's group write —
        # which is precisely what this re-include caught, and is a real hazard: an
        # operator who deploys from a context missing these vars silently locks the
        # external manager out of the directory it needs.
        rust_gameserver_manager_users:
          - "molecule_manager"
        rust_gameserver_identity_dir_mode: '2775'
        rust_gameserver_wipe_day_of_week: 4
        rust_gameserver_wipe_hour_of_day: 19
        rust_gameserver_molecule_test: true

    - name: Verify rust config directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_dirs
      loop:
        - /etc/rust
        - /etc/rust/install
        - /etc/rust/install/test
        - /etc/rust/install/test/server/test
        - /etc/rust/install/test/oxide
        - /etc/rust/install/test/oxide/plugins
        - /etc/rust/install/test/RustDedicated_Data
        - /etc/rust/install/test/RustDedicated_Data/Managed

    - name: Assert all directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
      loop: "{{ config_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify rust configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_files
      loop:
        - /etc/rust/install/test/server/test/rust.env
        - /etc/rust/install/test/server/test/seed.env
        - /etc/rust/install/test/server/test/wipe.sh

    - name: Assert configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
      loop: "{{ config_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The regression test for the single-file bind mount. rustd.xyz rewrites these two files
    # IN PLACE so the container's mount (which follows the inode, not the path) keeps pointing
    # at the live data — and an in-place rewrite needs write permission on the FILE. With 640
    # root:root the manager could only replace the file, which orphans the mount and silently
    # strands the container on the original inode.
    #
    # Asserted on the mode bits rather than "the manager can write", because the manager user
    # does not exist in this scenario; the group grant is what makes it possible.
    - name: Stat the env files the external manager must rewrite in place
      ansible.builtin.stat:
        path: "{{ item }}"
      register: manager_writable_files
      loop:
        - /etc/rust/install/test/server/test/rust.env
        - /etc/rust/install/test/server/test/seed.env

    - name: Assert the env files are group-writable for the runtime group
      ansible.builtin.assert:
        that:
          - item.stat.wgrp
          - item.stat.gid | int == 1000
        fail_msg: >-
          {{ item.stat.path }} is mode {{ item.stat.mode }} gid {{ item.stat.gid }} —
          the manager cannot rewrite it in place, so it would replace the inode and
          orphan the container's single-file bind mount.
      loop: "{{ manager_writable_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert rust.env is still not world-readable
      ansible.builtin.assert:
        that:
          - not manager_writable_files.results[0].stat.roth
        fail_msg: rust.env carries RUST_RCON_PASSWORD and must never be world-readable

    - name: Verify rust.env contains expected content
      ansible.builtin.lineinfile:
        path: /etc/rust/install/test/server/test/rust.env
        line: 'RUST_SERVER_NAME="Test Server"'
        state: present
      check_mode: true
      register: rust_env_check

    - name: Assert rust.env has correct content
      ansible.builtin.assert:
        that:
          - not rust_env_check.changed

    - name: Check if rust wipe cron exists
      ansible.builtin.stat:
        path: /etc/cron.d/rust_wipe_test
      register: cron_file_check

    - name: Assert cron job file exists
      ansible.builtin.assert:
        that:
          - cron_file_check.stat.exists
          - cron_file_check.stat.isreg

    - name: Read seed.env after re-converge
      ansible.builtin.slurp:
        src: /etc/rust/install/test/server/test/seed.env
      register: seed_env_content

    - name: Assert the rotated seed survived the re-run (create-only semantics)
      ansible.builtin.assert:
        that:
          - "'99999' in (seed_env_content.content | b64decode)"

    - name: Check rust.env drift was overwritten (default overwrite_env)
      ansible.builtin.lineinfile:
        path: /etc/rust/install/test/server/test/rust.env
        line: 'RUST_SERVER_NAME="Test Server"'
        state: present
      check_mode: true
      register: rust_env_restored

    - name: Assert rust.env was re-templated over the drift
      ansible.builtin.assert:
        that:
          - not rust_env_restored.changed

    - name: Stat oxide plugins directory ownership
      ansible.builtin.stat:
        path: /etc/rust/install/test/oxide/plugins
      register: oxide_dir_stat

    - name: Assert identity directories are owned by the runtime user
      ansible.builtin.assert:
        that:
          - oxide_dir_stat.stat.uid == 1000
          - oxide_dir_stat.stat.gid == 1000

    - name: Stat rust.env permissions
      ansible.builtin.stat:
        path: /etc/rust/install/test/server/test/rust.env
      register: rust_env_stat

    - name: Assert rust.env is 640 root:pgid (enforced even on the bootstrap path)
      ansible.builtin.assert:
        that:
          - rust_env_stat.stat.mode == '0640'
          - rust_env_stat.stat.uid == 0
          - rust_env_stat.stat.gid == 1000

    - name: Stat the identity directory
      ansible.builtin.stat:
        path: /etc/rust/install/test/server/test
      register: identity_dir_stat

    - name: Assert the identity directory is group-writable and setgid
      ansible.builtin.assert:
        that:
          - identity_dir_stat.stat.mode == '2775'
          - identity_dir_stat.stat.gid == 1000
        fail_msg: >-
          The identity directory must be group-writable and SETGID. Without setgid,
          `sed -i` on seed.env hands the replacement to the manager's own group and
          the container can no longer read its own seed.

    - name: Read the runtime group
      ansible.builtin.getent:
        database: group
        key: "1000"

    - name: Assert the manager user was added to the runtime group
      ansible.builtin.assert:
        that:
          - "'molecule_manager' in (ansible_facts.getent_group | dict2items | first).value[2]"
        fail_msg: >-
          molecule_manager is not in the runtime group, so an external manager could
          not write inside the identity directory without root.
